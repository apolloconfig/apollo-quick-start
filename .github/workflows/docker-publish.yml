name: Publish Quick Start ZIP and Docker image

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Apollo release version (x.y.z)'
        required: true
      tag:
        description: 'Additional Docker tag (latest or a custom alias)'
        required: false
        default: 'latest'

permissions:
  contents: write

concurrency:
  group: publish-quick-start
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.release_version }}
      DOCKER_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release and image tags
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --tags origin "refs/heads/$DEFAULT_BRANCH"
          current_version=$(git show FETCH_HEAD:VERSION)
          tags=$(python3 scripts/docker_tags.py "$VERSION" "$DOCKER_TAG" "$current_version")
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          name="apollo-quick-start-$VERSION"
          echo "NAME=$name" >> "$GITHUB_ENV"

          mkdir -p dist
          ref="$GITHUB_SHA"
          if gh release view "v$VERSION" --json isDraft,assets,targetCommitish > "$RUNNER_TEMP/release.json"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            draft=$(jq -r .isDraft "$RUNNER_TEMP/release.json")
            echo "draft=$draft" >> "$GITHUB_OUTPUT"
            ref=$(jq -r .targetCommitish "$RUNNER_TEMP/release.json")
            if jq -e --arg file "$name.zip" '.assets | any(.name == $file and .state == "uploaded")' "$RUNNER_TEMP/release.json" >/dev/null; then
              gh release download "v$VERSION" --pattern "$name.zip" --dir dist
            fi
            if jq -e --arg file "$name.zip.sha256" '.assets | any(.name == $file and .state == "uploaded")' "$RUNNER_TEMP/release.json" >/dev/null; then
              gh release download "v$VERSION" --pattern "$name.zip.sha256" --dir dist
              cp "dist/$name.zip.sha256" "$RUNNER_TEMP/existing.sha256"
            fi
            if [[ "$draft" == false && ( ! -f "dist/$name.zip" || ! -f "dist/$name.zip.sha256" ) ]]; then
              echo "::error::Published release is missing its ZIP or checksum"
              exit 1
            fi
          fi
          if [[ ! -f "dist/$name.zip" ]]; then
            if git rev-parse --verify --quiet "refs/tags/v$VERSION^{commit}" >/dev/null; then
              ref="refs/tags/v$VERSION"
            fi
            mkdir release-source
            git archive "$ref" | tar -x -C release-source
            if [[ ! -f release-source/VERSION || "$(cat release-source/VERSION)" != "$VERSION" ]]; then
              echo "::error::Release source does not record $VERSION. For the legacy v3.0.0 tag use the original verified JAR to bootstrap its ZIP."
              exit 1
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.release.outputs.build == 'true'
        with:
          repository: apolloconfig/apollo
          ref: v${{ inputs.release_version }}
          path: apollo-source
          persist-credentials: false

      - uses: actions/setup-java@v4
        if: steps.release.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build the versioned distribution
        if: steps.release.outputs.build == 'true'
        run: |
          set -euo pipefail
          python3 scripts/sync_from_apollo_release.py --apollo-repo-root apollo-source --quick-start-root release-source --check
          (cd apollo-source && ./mvnw -B -pl apollo-assembly -am -DskipTests=true package)
          jar="apollo-source/apollo-assembly/target/apollo-assembly-$VERSION.jar"
          python3 scripts/package_release.py --version "$VERSION" --root release-source --jar "$jar" --output dist

      - name: Verify and extract the ZIP for Docker
        working-directory: dist
        run: |
          set -euo pipefail
          if [[ ! -f "$NAME.zip.sha256" ]]; then
            sha256sum "$NAME.zip" > "$NAME.zip.sha256"
          fi
          sha256sum "$NAME.zip" | diff - "$NAME.zip.sha256"
          if [[ -f "$RUNNER_TEMP/existing.sha256" ]]; then
            diff "$RUNNER_TEMP/existing.sha256" "$NAME.zip.sha256"
          fi
          unzip -q "$NAME.zip"
          test -x "$NAME/demo.sh"
          test "$(cat "$NAME/VERSION")" = "$VERSION"
          unzip -tq "$NAME/apollo-all-in-one.jar"
          unzip -tq "$NAME/client/apollo-demo.jar"
          docker compose -f "$NAME/docker-compose.yml" config -q
          docker compose -f "$NAME/docker-compose-arm64.yml" config -q

      - name: Stage ZIP and checksum in a draft release
        if: steps.release.outputs.draft == 'true' || steps.release.outputs.exists != 'true'
        working-directory: dist
        env:
          EXISTS: ${{ steps.release.outputs.exists }}
        run: |
          set -euo pipefail
          if [[ "$EXISTS" != true ]]; then
            gh release create "v$VERSION" --draft --title "Apollo Quick Start $VERSION" --target "$GITHUB_SHA" --notes "Download $NAME.zip for the runnable Quick Start distribution."
          fi
          gh release view "v$VERSION" --json assets > "$RUNNER_TEMP/staged.json"
          for file in "$NAME.zip" "$NAME.zip.sha256"; do
            state=$(jq -r --arg file "$file" '.assets[] | select(.name == $file) | .state' "$RUNNER_TEMP/staged.json")
            case "$state" in
              uploaded) continue ;;
              "") gh release upload "v$VERSION" "$file" ;;
              starter) gh release upload "v$VERSION" "$file" --clobber ;;
              *) echo "::error::Unexpected state $state for $file"; exit 1 ;;
            esac
          done

      - uses: docker/login-action@v4
        with:
          username: nobodyiam
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: dist/${{ env.NAME }}
          file: dist/${{ env.NAME }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}

      - name: Publish the verified release
        if: steps.release.outputs.draft == 'true' || steps.release.outputs.exists != 'true'
        run: gh release edit "v$VERSION" --draft=false
